
---
- name: Power off, snapshot, and power on VMware VM
  hosts: localhost
  gather_facts: false

  vars:
    datacenter_name: "ITESM_BD"
    vm_folder: "NOPROD_DB_LIN"
    vm_name: "pprd004db07"
    snapshot_name: "snapshot_ansible"
    snapshot_description: "Snapshot before maintenance"
    validate_certs: false

  tasks:

    #- name: Gracefully shut down the VM
    #  vmware.vmware.vm_powerstate:
    #    validate_certs: "{{ validate_certs }}"
    #    datacenter: "{{ datacenter_name }}"
    #    folder: "{{ vm_folder }}"
    #    name: "{{ vm_name }}"
    #    state: shutdown-guest
    #    timeout: 1800

    #- name: Ensure the VM is powered off
    #  vmware.vmware.vm_powerstate:
    #    validate_certs: "{{ validate_certs }}"
    #    datacenter: "{{ datacenter_name }}"
    #    folder: "{{ vm_folder }}"
    #    name: "{{ vm_name }}"
    #    state: powered-off
    #    timeout: 1800

    - name: Create snapshot of the powered-off VM
      vmware.vmware.vm_snapshot:
        validate_certs: "{{ validate_certs }}"
        datacenter: "{{ datacenter_name }}"
        folder: "{{ vm_folder }}"
        name: "{{ vm_name }}"
        state: present
        snapshot_name: "{{ snapshot_name }}"
        description: "{{ snapshot_description }}"
        timeout: 3600
      register: snapshot_result

    #- name: Power on the VM
    #  vmware.vmware.vm_powerstate:
    #    validate_certs: "{{ validate_certs }}"
    #    datacenter: "{{ datacenter_name }}"
    #    folder: "{{ vm_folder }}"
    #    name: "{{ vm_name }}"
    #    state: powered-on
    #    timeout: 1800

    - name: Display snapshot result
      ansible.builtin.debug:
        msg:
          - "VM: {{ vm_name }}"
          - "Snapshot: {{ snapshot_name }}"
          - "Snapshot operation: {{ snapshot_result.changed }}"
          - "Workflow completed."

