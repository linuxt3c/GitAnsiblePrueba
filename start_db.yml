---
- name: Start Oracle databases for maintenance
  hosts: base_datos
  become: true
  become_user: oracle
  gather_facts: false

  vars:
    oracle_sid: "PROD"
    databases:
      - "PROD"
      - "EEIPROD"
    id_desicion: "NO"  

  tasks:

    - name: Load Oracle environment
      ansible.builtin.shell: |
        export ORAENV_ASK=NO
        export ORACLE_SID="{{ oracle_sid }}"
        export ORACLE_HOME="/u00/app/oracle/product/19c"
        export PATH="$ORACLE_HOME/bin:$PATH"
        echo "ORACLE_SID=$ORACLE_SID"
        echo "ORACLE_HOME=$ORACLE_HOME"
        echo "ORAENV_ASK=$ORAENV_ASK"
      args:
        executable: /bin/bash
      register: oracle_environment
      changed_when: false

    - name: Show Oracle environment
      ansible.builtin.debug:
        var: oracle_environment.stdout_lines

    - name: Verify srvctl is available
      ansible.builtin.shell: |
        export ORAENV_ASK=NO
        export ORACLE_SID="{{ oracle_sid }}"
        export ORACLE_HOME="/u00/app/oracle/product/19c"
        export PATH="$ORACLE_HOME/bin:$PATH"
        echo "ORACLE_SID=$ORACLE_SID"
        echo "ORACLE_HOME=$ORACLE_HOME"
        echo "ORAENV_ASK=$ORAENV_ASK"
        which srvctl
      args:
        executable: /bin/bash
      register: srvctl_check
      changed_when: false

    - name: Display srvctl location
      ansible.builtin.debug:
        msg: "SRVCTL: {{ srvctl_check.stdout }}"

    - name: Check Oracle database status
      ansible.builtin.shell: |
        export ORAENV_ASK=NO
        export ORACLE_SID="{{ oracle_sid }}"
        export ORACLE_HOME="/u00/app/oracle/product/19c"
        export PATH="$ORACLE_HOME/bin:$PATH"
        echo "ORACLE_SID=$ORACLE_SID"
        echo "ORACLE_HOME=$ORACLE_HOME"
        echo "ORAENV_ASK=$ORAENV_ASK"
        srvctl status database -d "{{ item }}"
      args:
        executable: /bin/bash
      loop: "{{ databases }}"
      register: database_status
      changed_when: false
      failed_when: false

    - name: Display database status after shutdown
      ansible.builtin.debug:
        msg:
          - "Database: {{ item.item }}"
          - "{{ item.stdout }}"
      loop: "{{ database_status.results }}"

    - name: Start Oracle databases
      ansible.builtin.shell: |
        export ORAENV_ASK=NO
        export ORACLE_SID="{{ oracle_sid }}"
        export ORACLE_HOME="/u00/app/oracle/product/19c"
        export PATH="$ORACLE_HOME/bin:$PATH"
        echo "ORACLE_SID=$ORACLE_SID"
        echo "ORACLE_HOME=$ORACLE_HOME"
        echo "ORAENV_ASK=$ORAENV_ASK"
        srvctl start database -d "{{ item }}" -o immediate
      args:
        executable: /bin/bash
      loop: "{{ databases }}"
      register: start_database
      changed_when: true

    - name: Verify databases are started
      ansible.builtin.shell: |
        export ORAENV_ASK=NO
        export ORACLE_SID="{{ oracle_sid }}"
        export ORACLE_HOME="/u00/app/oracle/product/19c"
        export PATH="$ORACLE_HOME/bin:$PATH"
        echo "ORACLE_SID=$ORACLE_SID"
        echo "ORACLE_HOME=$ORACLE_HOME"
        echo "ORAENV_ASK=$ORAENV_ASK"
        srvctl status database -d "{{ item }}"
      args:
        executable: /bin/bash
      loop: "{{ databases }}"
      register: database_status_after
      changed_when: false
      failed_when: false

    - name: Display database status after shutdown
      ansible.builtin.debug:
        msg:
          - "Database: {{ item.item }}"
          - "{{ item.stdout }}"
      loop: "{{ database_status_after.results }}"
      
    - name: Start Oracle HAS
      ansible.builtin.shell: |
        export ORAENV_ASK=NO
        export ORACLE_SID="+ASM"
        export ORACLE_HOME="/u01/app/oracle/grid/product/19c"
        export PATH="$ORACLE_HOME/bin:$PATH"
        echo "ORACLE_SID=$ORACLE_SID"
        echo "ORACLE_HOME=$ORACLE_HOME"
        crsctl start has -f
      become: true
      become_user: oracle
      args:
        executable: /bin/bash

    - name: Wait until ASM is running
      ansible.builtin.shell: |
        export ORAENV_ASK=NO
        export ORACLE_SID="+ASM"
        export ORACLE_HOME="/u01/app/oracle/grid/product/19c"
        export PATH="$ORACLE_HOME/bin:$PATH"
        echo "ORACLE_SID=$ORACLE_SID"
        echo "ORACLE_HOME=$ORACLE_HOME"
        srvctl status asm
    args:
      executable: /bin/bash
    register: asm_status
    changed_when: false
    until: "'is running' in asm_status.stdout | lower"
    retries: 60
    delay: 10

    - name: Display ASM status
      ansible.builtin.debug:
      msg: "ASM status: {{ asm_status.stdout }}"

    - name: Check ASM disk groups
      ansible.builtin.shell: |
        export ORAENV_ASK=NO
        export ORACLE_SID="+ASM"
        export ORACLE_HOME="/u01/app/oracle/grid/product/19c"
        export PATH="$ORACLE_HOME/bin:$PATH"
        echo "ORACLE_SID=$ORACLE_SID"
        echo "ORACLE_HOME=$ORACLE_HOME"

        crsctl stat res -t -w "TYPE = ora.diskgroup.type"
    args:
      executable: /bin/bash
    register: diskgroup_status
    changed_when: false
    failed_when: false

    - name: Display ASM disk group status
      ansible.builtin.debug:
        var: diskgroup_status.stdout_lines

    - name: Extract ASM disk group resources
      ansible.builtin.set_fact:
        asm_diskgroups: >-
          {{
            diskgroup_status.stdout_lines
            | select('match', '^ora\..+\.dg\s+')
            | list
          }}

  - name: Validate ASM disk groups were found
    ansible.builtin.assert:
      that:
        - asm_diskgroups | length > 0
      fail_msg: |
      No ASM disk groups were found.
      CRSCTL output:
      {{ diskgroup_status.stdout }}

  - name: Validate all ASM disk groups are ONLINE
    ansible.builtin.assert:
      that:
        - item is search('ONLINE')
      fail_msg: "ASM disk group is not ONLINE: {{ item }}"
      success_msg: "ASM disk group is ONLINE: {{ item }}"
    loop: "{{ asm_diskgroups }}"
  
